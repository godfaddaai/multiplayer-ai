name: Product proposal
description: Propose a focused addition to the multiplayer AI workflow
title: "[proposal] "
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Teammate problem
      description: What coordination failure happens in a real AI session today?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired terminal workflow
      description: Show the shortest command-level experience.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Identity, permission, and privacy boundary
      description: What new authority or data would this expose?
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Product principles
      options:
        - label: This keeps the terminal as the primary interface.
          required: true
        - label: This does not require transcript analytics or surveillance.
          required: true
